spring:
  datasource:
    url: jdbc:h2:mem:wallet_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-init-sql: SET LOCK_TIMEOUT 10000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  level:
    io.github.lalathomas.walletledger: WARN
