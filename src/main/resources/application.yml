spring:
  application:
    name: wallet-ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet_ledger}
    username: ${DB_USERNAME:wallet}
    password: ${DB_PASSWORD:wallet}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 5000
      connection-init-sql: SET lock_timeout TO '5s'
  jackson:
    deserialization:
      accept-float-as-int: false
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        query:
          fail_on_pagination_over_collection_fetch: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    io.github.lalathomas.walletledger: INFO
