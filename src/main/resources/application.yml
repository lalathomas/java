spring:
  application:
    name: wallet-ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet_ledger}
    username: ${DB_USERNAME:wallet}
    password: ${DB_PASSWORD:wallet}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 5000
      connection-init-sql: SET lock_timeout TO '5s'
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        query:
          fail_on_pagination_over_collection_fetch: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
    info:
      enabled: true
    prometheus:
      access: read-only
  info:
    env:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Concurrency-safe wallet ledger service
    api-version: v1

springdoc:
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level correlationId=%X{correlationId:-none} [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    io.github.lalathomas.walletledger: INFO
