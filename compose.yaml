services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wallet_ledger
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - wallet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/wallet_ledger
      DB_USERNAME: wallet
      DB_PASSWORD: wallet
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 25s

volumes:
  wallet-postgres-data:
